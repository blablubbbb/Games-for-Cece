<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Einmaleins – Games for Cece</title>
  <style>
    html, body { margin: 0; height: 100%; overscroll-behavior: none; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #ffb3d9, #b3c6ff);
      color: #2b1a4a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.5rem;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .top {
      width: 100%; max-width: 420px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 0.4rem;
    }
    .top a, .pill {
      background: #fff8; border-radius: 999px; padding: 0.3rem 0.9rem;
      font-size: 1.15rem; font-weight: bold; color: inherit; text-decoration: none;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .coin { width: 1.5em; height: 1.5em; }
    .vidas .perdida { opacity: 0.25; }

    /* ---------- Die Aufgabe ---------- */
    .tarea {
      width: min(94vw, 420px);
      background: #fff; border-radius: 1rem; box-shadow: 0 4px 0 #0002;
      padding: 0.5rem 0.8rem 0.6rem; box-sizing: border-box;
      text-align: center; position: relative;
    }
    .serie {
      position: absolute; left: 0.7rem; top: 0.5rem;
      font-size: 0.95rem; font-weight: bold; color: #7b3fe4;
      display: flex; align-items: center; gap: 0.15rem;
      transition: transform 0.15s;
    }
    .serie.crece { transform: scale(1.45); }
    .serie.apagada { opacity: 0.25; }

    .pregunta { font-size: clamp(2.1rem, 11vw, 3rem); font-weight: bold; line-height: 1.15; }
    .pregunta .op { color: #7b3fe4; }
    .respuesta {
      font-size: clamp(1.6rem, 8vw, 2.1rem); font-weight: bold;
      min-height: 1.3em; letter-spacing: 2px; color: #2b1a4a;
    }
    .respuesta.vacia { color: #2b1a4a33; }
    .respuesta.mal { color: #e4573f; }

    .barra { height: 8px; border-radius: 4px; background: #2b1a4a1a; overflow: hidden; margin-top: 0.3rem; }
    .barra div { height: 100%; width: 100%; background: #7b3fe4; transform-origin: left; }
    .barra div.poco { background: #e4573f; }

    .tarea.sacude { animation: sacudir 0.35s; }
    @keyframes sacudir {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-9px); } 40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); } 80% { transform: translateX(4px); }
    }

    /* ---------- Die Schatzkarte: 10x10 Aufgaben ---------- */
    .mapa {
      width: min(45vw, 160px);
      background: #2b1a4a; border-radius: 10px;
      padding: 6px; box-sizing: border-box; margin: 0.45rem auto 0;
      display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px;
    }
    .mapa i {
      aspect-ratio: 1; border-radius: 2px; background: #ffffff14;
      transition: background 0.3s, transform 0.3s;
    }
    .mapa i.visto     { background: #7b3fe4aa; }
    .mapa i.flojo     { background: #e4573f; }
    .mapa i.dominado  { background: #ffd34d; }
    .mapa i.brilla    { transform: scale(1.7); box-shadow: 0 0 10px #ffd34d; }

    /* ---------- Zifferntasten ---------- */
    .teclado {
      width: min(94vw, 420px);
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 0.45rem; margin-top: 0.5rem;
    }
    .teclado button {
      height: clamp(42px, 7.4dvh, 62px);
      font-size: clamp(1.2rem, 5vw, 1.7rem); font-weight: bold;
      border: none; border-radius: 14px;
      background: #fff; color: #2b1a4a; box-shadow: 0 4px 0 #0003;
    }
    .teclado button:active { transform: translateY(3px); box-shadow: 0 1px 0 #0003; }
    .teclado .ok { background: #7b3fe4; color: #fff; }
    .teclado .borrar { background: #ffffffcc; }

    /* ---------- Fliegende Zahlen und Funken ---------- */
    .flota {
      position: fixed; font-size: 1.9rem; font-weight: bold;
      pointer-events: none; animation: subir 1.1s forwards;
      text-shadow: 0 2px 0 #fff; display: flex; align-items: center; gap: 0.25rem;
      z-index: 5;
    }
    .flota img { width: 2rem; height: 2rem; }
    @keyframes subir { to { transform: translateY(-80px); opacity: 0; } }

    .chispa {
      position: fixed; width: 9px; height: 9px; border-radius: 50%;
      pointer-events: none; z-index: 4;
      animation: volar 0.75s ease-out forwards;
    }
    @keyframes volar {
      to { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
    }

    #destello {
      position: fixed; inset: 0; pointer-events: none; z-index: 3;
      background: radial-gradient(circle, #ffd34d55, transparent 65%);
      opacity: 0; transition: opacity 0.45s;
    }

    /* ---------- Überlagerungen ---------- */
    #over, #inicio {
      position: fixed; inset: 0; background: #0008;
      display: none; align-items: center; justify-content: center;
      padding: 1rem; box-sizing: border-box; z-index: 10;
    }
    #over .box, #inicio .box {
      background: #fff; border-radius: 1rem; padding: 1.2rem 1.3rem;
      text-align: center; max-width: 340px; width: 100%; box-sizing: border-box;
      max-height: 92dvh; overflow-y: auto;
    }
    #over h2, #inicio h2 { margin: 0 0 0.5rem; }
    #over .pill, #inicio .pill { justify-content: center; background: none; }
    #over button, #inicio button {
      font-size: 1.2rem; padding: 0.7rem 1.5rem; border: none;
      border-radius: 999px; background: #7b3fe4; color: #fff; margin-top: 0.9rem;
    }
    .marcas { text-align: left; margin-top: 0.7rem; font-size: 0.95rem; }
    .marcas div { display: flex; justify-content: space-between; padding: 0.15rem 0; }
    .marcas b { color: #7b3fe4; }
    .nuevo { color: #e4573f; font-weight: bold; }

    /* Die große Karte am Rundenende, mit Beschriftung */
    .carta { margin-top: 0.8rem; }
    .carta table { border-collapse: collapse; margin: 0 auto; }
    .carta td { padding: 0; }
    .carta td.e { font-size: 0.6rem; opacity: 0.5; width: 1.1rem; text-align: center; }
    .carta span {
      display: block; width: 1.1rem; height: 1.1rem; border-radius: 3px;
      background: #2b1a4a14; margin: 1px;
    }
    .carta span.visto    { background: #7b3fe4aa; }
    .carta span.flojo    { background: #e4573f; }
    .carta span.dominado { background: #ffd34d; }
    .leyenda { font-size: 0.75rem; margin-top: 0.4rem; display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; }
    .leyenda i { display: inline-block; width: 0.7rem; height: 0.7rem; border-radius: 2px; vertical-align: -1px; margin-right: 0.2rem; }
  </style>
</head>
<body>
  <div class="top">
    <a href="index.html">⬅︎</a>
    <div class="pill vidas" id="vidas">❤️❤️❤️</div>
    <div class="pill"><img class="coin" src="coin.svg" alt="Münzen"><span id="coins">0</span></div>
  </div>

  <div class="tarea" id="tarea">
    <div class="serie apagada" id="serie">🔥<span id="serie-n">0</span></div>
    <div class="pregunta" id="pregunta">–</div>
    <div class="respuesta vacia" id="respuesta">?</div>
    <div class="barra"><div id="barra"></div></div>
  </div>

  <div class="mapa" id="mapa"></div>

  <div class="teclado">
    <button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button>
    <button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button>
    <button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button>
    <button class="borrar" id="btn-borrar">⌫</button>
    <button data-d="0">0</button>
    <button class="ok" id="btn-ok">✓</button>
  </div>

  <div id="destello"></div>

  <div id="inicio">
    <div class="box">
      <h2>Einmaleins</h2>
      <div class="marcas" id="marcas-inicio"></div>
      <div class="carta" id="carta-inicio"></div>
      <button id="btn-empezar">Los geht's</button>
    </div>
  </div>

  <div id="over">
    <div class="box">
      <h2 id="over-titulo">¡Se acabó!</h2>
      <div class="pill">In dieser Runde: <img class="coin" src="coin.svg" alt="Münzen"><span id="round">0</span></div>
      <div class="marcas" id="marcas-fin"></div>
      <div class="carta" id="carta-fin"></div>
      <button id="btn-otra">Nochmal</button>
    </div>
  </div>

  <script src="fallos.js"></script>
  <script>
    // ---------- Die Aufgaben ----------
    // Das kleine Einmaleins: 1x1 bis 10x10. Eine Aufgabe wird immer unter
    // ihrem kleineren Faktor zuerst abgelegt ("7x8", nicht "8x7"), denn
    // 7·8 und 8·7 sind dasselbe Wissen. Deshalb leuchten auf der Karte
    // auch immer beide Felder zusammen.
    const MAX = 10;
    const TODAS = [];
    for (let a = 1; a <= MAX; a++)
      for (let b = a; b <= MAX; b++) TODAS.push(a + "x" + b);

    // Anteil Geteilt-Aufgaben (56 : 7 = ?) an allen Aufgaben
    const P_DIVISION = 0.35;

    // Bedenkzeit in Sekunden, wird mit jeder richtigen Antwort etwas knapper.
    // Dazwischen wird gerade interpoliert. Zum Nachregeln reicht die Tabelle.
    const TIEMPO = [
      [0,  9.0],
      [20, 6.0],
      [50, 4.5],
      [100, 3.5],
    ];

    const VIDAS_MAX = 3;
    const JUEGO = "einmaleins";       // Schlüssel fürs gemeinsame Fehlergedächtnis

    // ---------- Zustand ----------
    const elPregunta = document.getElementById("pregunta");
    const elRespuesta = document.getElementById("respuesta");
    const elBarra = document.getElementById("barra");
    const elTarea = document.getElementById("tarea");
    const elSerie = document.getElementById("serie");
    const elSerieN = document.getElementById("serie-n");
    const elMapa = document.getElementById("mapa");
    const elVidas = document.getElementById("vidas");
    const elCoins = document.getElementById("coins");

    let coins = 0;
    try { coins = Number(localStorage.getItem("cece-coins")) || 0; } catch (e) {}
    elCoins.textContent = coins;

    let rec = { serie: 0, aciertos: 0, rapido: 0 };
    try { rec = Object.assign(rec, JSON.parse(localStorage.getItem("cece-einmaleins-rec") || "{}")); } catch (e) {}

    let tarea, escrito, vidas, serie, aciertos, monedasRonda, corriendo;
    let t0, duracionRonda, animId, nuevosDominados, recordsBatidos;
    // Stand der laufenden Runde, für die Bestmarken am Ende
    let serieMax = 0, rapidoRonda = 0;

    function azar(n) { return Math.floor(Math.random() * n); }

    function guardarMonedas() {
      elCoins.textContent = coins;
      try { localStorage.setItem("cece-coins", coins); } catch (e) {}
    }

    function guardarRec() {
      try { localStorage.setItem("cece-einmaleins-rec", JSON.stringify(rec)); } catch (e) {}
    }

    // ---------- Die Schatzkarte ----------
    // 10x10 Felder. Jedes Feld ist eine Aufgabe; die Farbe sagt, wie sicher
    // sie sitzt. Beide Felder einer Aufgabe (7x8 und 8x7) sind gleich.
    const celdas = [];
    for (let f = 1; f <= MAX; f++) {
      for (let c = 1; c <= MAX; c++) {
        const i = document.createElement("i");
        i.dataset.clave = Math.min(f, c) + "x" + Math.max(f, c);
        elMapa.appendChild(i);
        celdas.push(i);
      }
    }

    // Wie steht es um eine Aufgabe? Das weiß das gemeinsame Fehlergedächtnis.
    // "" = noch nie dran, flojo = wackelt, visto = fast, dominado = sitzt.
    // "Sitzt" muss man sich verdienen: dreimal richtig reicht nicht allein,
    // es müssen auch drei Viertel aller Versuche richtig gewesen sein.
    function estado(clave) {
      const n = Fallos.intentos(JUEGO, clave);
      const total = n.mal + n.bien;
      if (!total) return "";
      const d = n.bien / total;
      if (d < 0.5) return "flojo";
      if (n.bien >= 3 && d >= 0.75) return "dominado";
      return "visto";
    }

    function pintarMapa() {
      for (const i of celdas) i.className = estado(i.dataset.clave);
    }

    function destacar(clave) {
      for (const i of celdas) {
        if (i.dataset.clave !== clave) continue;
        i.classList.add("brilla");
        setTimeout(() => i.classList.remove("brilla"), 450);
      }
    }

    // Die große beschriftete Karte für die Überlagerungen
    function cartaGrande(destino) {
      let h = "<table><tr><td class='e'></td>";
      for (let c = 1; c <= MAX; c++) h += "<td class='e'>" + c + "</td>";
      h += "</tr>";
      for (let f = 1; f <= MAX; f++) {
        h += "<tr><td class='e'>" + f + "</td>";
        for (let c = 1; c <= MAX; c++) {
          const cl = Math.min(f, c) + "x" + Math.max(f, c);
          h += "<td><span class='" + estado(cl) + "'></span></td>";
        }
        h += "</tr>";
      }
      h += "</table><div class='leyenda'>" +
           "<span><i style='background:#ffd34d'></i>sitzt</span>" +
           "<span><i style='background:#7b3fe4aa'></i>fast</span>" +
           "<span><i style='background:#e4573f'></i>wackelt</span>" +
           "<span><i style='background:#2b1a4a14'></i>noch nie</span></div>";
      document.getElementById(destino).innerHTML = h;
    }

    // ---------- Eine neue Aufgabe ----------
    function nuevaTarea() {
      // Was danebenging, kommt ein paar Aufgaben später von selbst zurück.
      // Sonst eine aussuchen – Wackelkandidaten häufiger.
      const clave = Fallos.pendiente(JUEGO) || Fallos.elegir(JUEGO, TODAS);
      const [a, b] = clave.split("x").map(Number);

      // Mal oder Geteilt, und die Faktoren mal andersherum
      const vuelta = Math.random() < 0.5;
      const x = vuelta ? b : a, y = vuelta ? a : b;
      const producto = a * b;

      if (Math.random() < P_DIVISION) {
        tarea = { clave, texto: producto + " <span class='op'>:</span> " + x,
                  sol: y, etq: producto + " : " + x + " = " + y };
      } else {
        tarea = { clave, texto: x + " <span class='op'>×</span> " + y,
                  sol: producto, etq: x + " × " + y + " = " + producto };
      }

      escrito = "";
      elPregunta.innerHTML = tarea.texto;
      pintarRespuesta();

      duracionRonda = segundos();
      t0 = performance.now();
      corriendo = true;
      cancelAnimationFrame(animId);
      animId = requestAnimationFrame(tictac);
    }

    // Bedenkzeit für den aktuellen Stand
    function segundos() {
      const n = aciertos;
      if (n <= TIEMPO[0][0]) return TIEMPO[0][1];
      for (let i = 1; i < TIEMPO.length; i++) {
        const [n0, s0] = TIEMPO[i - 1], [n1, s1] = TIEMPO[i];
        if (n <= n1) return s0 + (s1 - s0) * (n - n0) / (n1 - n0);
      }
      return TIEMPO[TIEMPO.length - 1][1];
    }

    function tictac(t) {
      if (!corriendo) return;
      const queda = 1 - (t - t0) / (duracionRonda * 1000);
      elBarra.style.transform = "scaleX(" + Math.max(0, queda) + ")";
      elBarra.classList.toggle("poco", queda < 0.25);
      if (queda <= 0) return resolver(false, true);
      animId = requestAnimationFrame(tictac);
    }

    function pintarRespuesta() {
      elRespuesta.textContent = escrito || "?";
      elRespuesta.classList.toggle("vacia", !escrito);
      elRespuesta.classList.remove("mal");
    }

    // ---------- Eingabe ----------
    function teclear(d) {
      if (!corriendo || escrito.length >= 3) return;
      escrito += d;
      pintarRespuesta();
      // Stimmt die Zahl, geht es sofort weiter – das macht Tempo.
      if (Number(escrito) === tarea.sol) resolver(true, false);
    }

    function borrar() {
      if (!corriendo) return;
      escrito = escrito.slice(0, -1);
      pintarRespuesta();
    }

    function confirmar() {
      if (!corriendo || !escrito) return;
      resolver(Number(escrito) === tarea.sol, false);
    }

    // ---------- Auswerten ----------
    function resolver(bien, porTiempo) {
      corriendo = false;
      cancelAnimationFrame(animId);

      const antes = estado(tarea.clave);
      Fallos.anotar(JUEGO, tarea.clave, bien, tarea.etq);
      const ahora = estado(tarea.clave);
      if (bien && ahora === "dominado" && antes !== "dominado") nuevosDominados++;

      if (bien) {
        aciertos++;
        serie++;
        // Schnellste Antwort dieser Runde merken, verrechnet wird am Ende
        const tardado = (performance.now() - t0) / 1000;
        if (!rapidoRonda || tardado < rapidoRonda) rapidoRonda = tardado;

        let ganado = 1;
        if (serie % 5 === 0) ganado += 3;          // fünf in Folge
        coins += ganado;
        monedasRonda += ganado;
        guardarMonedas();

        pintarSerie();
        chispas(ahora === "dominado" && antes !== "dominado");
        flotante("+" + ganado);
        if (serie % 10 === 0) brillar();           // Meilenstein
      } else {
        vidas--;
        serie = 0;
        pintarSerie();
        pintarVidas();
        // Die ganze Aufgabe mit Ergebnis stehen lassen – das ist der Moment,
        // in dem sie es sich merkt. Daneben, was sie getippt hatte.
        elPregunta.innerHTML = tarea.etq.replace("×", "<span class='op'>×</span>")
                                        .replace(" : ", " <span class='op'>:</span> ");
        elRespuesta.textContent = porTiempo ? "⏱" : escrito;
        elRespuesta.classList.add("mal");
        elRespuesta.classList.remove("vacia");
        elTarea.classList.add("sacude");
        setTimeout(() => elTarea.classList.remove("sacude"), 360);
      }

      pintarMapa();
      destacar(tarea.clave);

      setTimeout(() => {
        if (vidas <= 0) return finDelJuego();
        nuevaTarea();
      }, bien ? 330 : 1500);
    }

    function pintarSerie() {
      if (serie > serieMax) serieMax = serie;
      elSerieN.textContent = serie;
      elSerie.classList.toggle("apagada", serie === 0);
      elSerie.classList.add("crece");
      setTimeout(() => elSerie.classList.remove("crece"), 160);
    }

    function pintarVidas() {
      let s = "";
      for (let i = 0; i < VIDAS_MAX; i++) {
        s += i < vidas ? "<span>❤️</span>" : '<span class="perdida">❤️</span>';
      }
      elVidas.innerHTML = s;
    }

    // ---------- Effekte ----------
    function flotante(txt) {
      const r = elTarea.getBoundingClientRect();
      const f = document.createElement("div");
      f.className = "flota";
      f.innerHTML = txt + ' <img src="coin.svg" alt="">';
      f.style.left = Math.min(r.left + r.width / 2 - 40, window.innerWidth - 110) + "px";
      f.style.top = (r.top + r.height / 2) + "px";
      document.body.appendChild(f);
      setTimeout(() => f.remove(), 1100);
    }

    function chispas(dorado) {
      const r = elPregunta.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const n = dorado ? 16 : 9;
      for (let i = 0; i < n; i++) {
        const c = document.createElement("div");
        c.className = "chispa";
        const ang = (Math.PI * 2 * i) / n + Math.random() * 0.4;
        const dist = 45 + Math.random() * (dorado ? 80 : 45);
        c.style.setProperty("--dx", Math.cos(ang) * dist + "px");
        c.style.setProperty("--dy", Math.sin(ang) * dist + "px");
        c.style.left = cx + "px";
        c.style.top = cy + "px";
        c.style.background = dorado ? "#ffd34d" : (i % 2 ? "#7b3fe4" : "#ff6fb5");
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 780);
      }
    }

    function brillar() {
      const d = document.getElementById("destello");
      d.style.opacity = "1";
      setTimeout(() => { d.style.opacity = "0"; }, 260);
    }

    // ---------- Rekorde ----------
    function listaMarcas(destino, conNuevos) {
      const dominadas = TODAS.filter(c => estado(c) === "dominado").length;
      const marca = (etq, val, nuevo) =>
        "<div><span>" + etq + "</span><b>" + val +
        (nuevo ? " <span class='nuevo'>neu!</span>" : "") + "</b></div>";
      let h = "";
      h += marca("Längste Serie", rec.serie, conNuevos && recordsBatidos.serie);
      h += marca("Meiste richtig", rec.aciertos, conNuevos && recordsBatidos.aciertos);
      h += marca("Schnellste Antwort", rec.rapido ? rec.rapido.toFixed(2) + " s" : "–",
                 conNuevos && recordsBatidos.rapido);
      h += marca("Aufgaben, die sitzen", dominadas + " von " + TODAS.length, false);
      document.getElementById(destino).innerHTML = h;
    }

    // ---------- Ende ----------
    function finDelJuego() {
      corriendo = false;
      // Erst jetzt gegen die Bestmarken verrechnen, damit "neu!" stimmt
      recordsBatidos = { serie: false, aciertos: false, rapido: false };
      if (serieMax > rec.serie) { rec.serie = serieMax; recordsBatidos.serie = true; }
      if (aciertos > rec.aciertos) { rec.aciertos = aciertos; recordsBatidos.aciertos = true; }
      if (rapidoRonda && (!rec.rapido || rapidoRonda < rec.rapido)) {
        rec.rapido = rapidoRonda; recordsBatidos.rapido = true;
      }
      guardarRec();

      document.getElementById("over-titulo").textContent =
        nuevosDominados > 0 ? (nuevosDominados === 1 ? "Eine Aufgabe sitzt jetzt!"
                                                     : nuevosDominados + " Aufgaben sitzen jetzt!")
                            : "Vorbei!";
      document.getElementById("round").textContent = monedasRonda;
      listaMarcas("marcas-fin", true);
      cartaGrande("carta-fin");
      document.getElementById("over").style.display = "flex";
    }

    // ---------- Start ----------
    function empezar() {
      document.getElementById("over").style.display = "none";
      document.getElementById("inicio").style.display = "none";
      vidas = VIDAS_MAX;
      serie = 0; serieMax = 0;
      aciertos = 0;
      monedasRonda = 0;
      nuevosDominados = 0;
      rapidoRonda = 0;
      pintarVidas();
      pintarSerie();
      pintarMapa();
      nuevaTarea();
    }

    function mostrarInicio() {
      corriendo = false;
      cancelAnimationFrame(animId);
      document.getElementById("over").style.display = "none";
      listaMarcas("marcas-inicio", false);
      cartaGrande("carta-inicio");
      document.getElementById("inicio").style.display = "flex";
    }

    // ---------- Steuerung ----------
    document.querySelectorAll(".teclado button[data-d]").forEach((b) => {
      b.addEventListener("pointerdown", (e) => { e.preventDefault(); teclear(b.dataset.d); });
    });
    document.getElementById("btn-borrar")
      .addEventListener("pointerdown", (e) => { e.preventDefault(); borrar(); });
    document.getElementById("btn-ok")
      .addEventListener("pointerdown", (e) => { e.preventDefault(); confirmar(); });

    document.addEventListener("keydown", (e) => {
      if (e.key >= "0" && e.key <= "9") teclear(e.key);
      else if (e.key === "Backspace") borrar();
      else if (e.key === "Enter") confirmar();
      else return;
      e.preventDefault();
    });

    document.getElementById("btn-empezar").addEventListener("click", empezar);
    document.getElementById("btn-otra").addEventListener("click", empezar);

    pintarMapa();
    mostrarInicio();
  </script>
</body>
</html>
