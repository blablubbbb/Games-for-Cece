<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games for Cece</title>
  <style>
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #ffb3d9, #b3c6ff);
      background-attachment: fixed;
      color: #2b1a4a;
      padding: 1rem;
      box-sizing: border-box;
      text-align: center;
    }
    h1 { margin: 0.5rem 0; font-size: clamp(2rem, 9vw, 3.5rem); }
    .coins {
      display: inline-block;
      background: #fff8;
      border-radius: 999px;
      padding: 0.4rem 1rem;
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 1.5rem;
    }
    .coin { width: 1.6em; height: 1.6em; vertical-align: middle; }
    .tiles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.8rem;
      max-width: 420px;
      margin: 0 auto;
    }
    .tile {
      aspect-ratio: 1;
      border-radius: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      font-size: 0.95rem;
      font-weight: bold;
      text-decoration: none;
      color: #2b1a4a;
      background: #fff;
      box-shadow: 0 4px 0 #0002;
    }
    .tile .icon { font-size: 2.2rem; }
    .tile .fach { font-size: 0.7rem; font-weight: normal; opacity: 0.6; }
    .tile:active { transform: translateY(3px); box-shadow: 0 1px 0 #0002; }
    .tile.locked { background: #fff6; color: #2b1a4a99; box-shadow: none; }
  </style>
</head>
<body>
  <h1>Games for Cece</h1>
  <div class="coins"><img class="coin" src="coin.svg" alt="Münzen"> <span id="coins">0</span></div>

  <div class="tiles">
    <a class="tile" href="verbos.html"><span class="icon">🎣</span>Verben<span class="fach">Spanisch</span></a>
    <div class="tile locked"><span class="icon">❓</span>Bald da</div>
    <div class="tile locked"><span class="icon">❓</span>Bald da</div>
    <div class="tile locked"><span class="icon">❓</span>Bald da</div>
    <div class="tile locked"><span class="icon">❓</span>Bald da</div>
    <div class="tile locked"><span class="icon">❓</span>Bald da</div>
  </div>

  <script>
    let coins = 0;
    try { coins = Number(localStorage.getItem("cece-coins")) || 0; } catch (e) {}
    document.getElementById("coins").textContent = coins;
  </script>
</body>
</html>
