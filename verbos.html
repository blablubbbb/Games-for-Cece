<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Verben – Games for Cece</title>
  <style>
    html, body { margin: 0; height: 100%; overscroll-behavior: none; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #ffb3d9, #b3c6ff);
      color: #2b1a4a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.6rem;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .top {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .top a, .pill {
      background: #fff8;
      border-radius: 999px;
      padding: 0.3rem 0.9rem;
      font-size: 1.2rem;
      font-weight: bold;
      color: inherit;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .coin { width: 1.6em; height: 1.6em; }
    .vidas { letter-spacing: 1px; }
    .vidas .perdida { opacity: 0.25; }

    /* Die Aufgabe: Pronomen groß, Verb klein darunter */
    .tarea {
      width: min(92vw, 420px);
      background: #fff;
      border-radius: 1rem;
      box-shadow: 0 4px 0 #0002;
      padding: 0.5rem 0.8rem 0.6rem;
      box-sizing: border-box;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .tarea .pron { font-size: 2.1rem; font-weight: bold; line-height: 1.1; }
    .tarea .inf { font-size: 0.95rem; opacity: 0.65; margin-top: 0.1rem; }
    .tarea .inf b { font-weight: 600; opacity: 1; }
    /* Zeigt an, dass nach der nahen Zukunft gefragt ist (ir a + Infinitiv) */
    .tarea .tiempo {
      display: none;
      background: #7b3fe4;
      color: #fff;
      border-radius: 999px;
      padding: 0.1rem 0.7rem;
      font-size: 0.8rem;
      font-weight: bold;
      margin-top: 0.3rem;
    }

    #campo {
      width: min(92vw, 420px);
      height: min(50dvh, 360px);
      position: relative;
      overflow: hidden;
      background: #2b1a4a;
      border-radius: 12px;
      box-sizing: border-box;
    }
    /* Die drei Bahnen */
    .bahn {
      position: absolute;
      top: 0; bottom: 0;
      width: 33.333%;
      border-right: 1px dashed #ffffff1a;
      box-sizing: border-box;
    }
    .bahn:last-child { border-right: none; }

    #grupo { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
    .ficha {
      position: absolute;
      width: 33.333%;
      padding: 0 4px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 46px;
    }
    .ficha span {
      display: block;
      width: 100%;
      text-align: center;
      background: #fff;
      border-radius: 10px;
      padding: 0.45rem 0.2rem;
      font-size: 1.02rem;
      font-weight: bold;
      box-shadow: 0 3px 0 #0003;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Ganze Wendungen wie "vamos a hablar": kleiner, darf auf zwei Zeilen.
       Die Schrift geht auf schmalen Handys mit der Bahnbreite mit, sonst
       wird das längste Wort ("descansamos") am Rand abgeschnitten. */
    .ficha.larga span {
      font-size: min(0.8rem, 3.6vw);
      line-height: 1.15;
      padding: 0.3rem 0.15rem;
    }

    #cesta {
      position: absolute;
      bottom: 6px;
      width: 33.333%;
      padding: 0 4px;
      box-sizing: border-box;
      transition: left 0.08s;
    }
    #cesta div {
      height: 16px;
      border-radius: 8px;
      background: #7b3fe4;
      box-shadow: 0 3px 0 #0005, inset 0 2px 0 #fff4;
    }

    /* Rückmeldung nach dem Fangen */
    #flash {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.2rem;
      background: #2b1a4aee;
      text-align: center;
      padding: 0 1rem;
      box-sizing: border-box;
    }
    #flash .marca { font-size: 2.6rem; line-height: 1; }
    #flash .txt { color: #fff; font-size: 1.25rem; font-weight: bold; }
    #flash .sub { color: #ffffffaa; font-size: 0.9rem; }

    .controls {
      width: min(92vw, 420px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
      margin-top: 0.7rem;
    }
    .controls button {
      height: 64px;
      font-size: 1.9rem;
      border: none;
      border-radius: 16px;
      background: #fff;
      color: #2b1a4a;
      box-shadow: 0 4px 0 #0003;
      touch-action: none;
    }
    .controls button:active { transform: translateY(3px); box-shadow: 0 1px 0 #0003; }
    .controls .soltar { background: #7b3fe4; color: #fff; }

    .float {
      position: fixed;
      font-size: 2rem;
      font-weight: bold;
      pointer-events: none;
      animation: up 1.2s forwards;
      text-shadow: 0 2px 0 #fff;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .float img { width: 2.2rem; height: 2.2rem; }
    @keyframes up { to { transform: translateY(-80px); opacity: 0; } }

    #over, #inicio {
      position: fixed; inset: 0;
      background: #0008;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      box-sizing: border-box;
    }
    #over .box, #inicio .box {
      background: #fff;
      border-radius: 1rem;
      padding: 1.3rem 1.5rem;
      text-align: center;
      max-width: 340px;
      width: 100%;
      box-sizing: border-box;
      max-height: 90dvh;
      overflow-y: auto;
    }
    #over h2, #inicio h2 { margin: 0 0 0.6rem; }
    #over .pill { justify-content: center; background: none; }
    #over button {
      font-size: 1.2rem;
      padding: 0.7rem 1.4rem;
      border: none;
      border-radius: 999px;
      background: #7b3fe4;
      color: #fff;
      margin-top: 1rem;
    }
    /* Zweitrangiger Knopf: gleiche Größe, nur umrandet statt gefüllt */
    #over button.otro {
      background: #fff;
      color: #7b3fe4;
      box-shadow: inset 0 0 0 2px #7b3fe4;
      font-size: 1rem;
      padding: 0.6rem 1rem;
      margin-left: 0.4rem;
    }

    /* Levelauswahl beim Start */
    #inicio p { margin: 0 0 0.2rem; opacity: 0.7; }
    #inicio button {
      display: block;
      width: 100%;
      font-size: 1.25rem;
      font-weight: bold;
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 14px;
      background: #7b3fe4;
      color: #fff;
      margin-top: 0.7rem;
      box-shadow: 0 4px 0 #0003;
    }
    #inicio button:active { transform: translateY(3px); box-shadow: 0 1px 0 #0003; }
    #inicio button small { display: block; font-size: 0.78rem; font-weight: normal; opacity: 0.85; }
    .repasar { margin-top: 0.9rem; text-align: left; }
    .repasar h3 { margin: 0 0 0.4rem; font-size: 0.95rem; }
    .repasar ul { margin: 0; padding-left: 1.1rem; font-size: 0.95rem; }
    .repasar li { margin-bottom: 0.15rem; }
    .repasar b { color: #7b3fe4; }
  </style>
</head>
<body>
  <div class="top">
    <a href="index.html">⬅︎</a>
    <div class="pill vidas" id="vidas">❤️❤️❤️</div>
    <div class="pill"><img class="coin" src="coin.svg" alt="Münzen"><span id="coins">0</span></div>
  </div>

  <div class="tarea">
    <div class="pron" id="pron">–</div>
    <div class="inf"><b id="inf">–</b> · <span id="sentido">–</span></div>
    <div class="tiempo" id="tiempo">mañana</div>
  </div>

  <div id="campo">
    <div class="bahn" style="left:0"></div>
    <div class="bahn" style="left:33.333%"></div>
    <div class="bahn" style="left:66.666%"></div>
    <div id="grupo"></div>
    <div id="cesta"><div></div></div>
    <div id="flash">
      <div class="marca" id="flash-marca"></div>
      <div class="txt" id="flash-txt"></div>
      <div class="sub" id="flash-sub"></div>
    </div>
  </div>

  <div class="controls">
    <button id="izq" aria-label="Links">◀</button>
    <button id="btn-soltar" class="soltar" aria-label="Fallen lassen">⬇</button>
    <button id="der" aria-label="Rechts">▶</button>
  </div>

  <div id="over">
    <div class="box">
      <h2>¡Se acabó!</h2>
      <div class="pill">In dieser Runde: <img class="coin" src="coin.svg" alt="Münzen"><span id="round">0</span></div>
      <div class="pill">Richtig: <span id="aciertos">0</span></div>
      <div class="pill" id="nivelFin">–</div>
      <div class="repasar" id="repasar"></div>
      <button id="again">Nochmal</button>
      <button id="cambiar" class="otro">Anderes Level</button>
    </div>
  </div>

  <div id="inicio">
    <div class="box">
      <h2>Verben</h2>
      <p>Welches Level?</p>
      <button data-nivel="1">Nivel 1<small>-ar und ser</small></button>
      <button data-nivel="2">Nivel 2<small>dazu -er und -ir</small></button>
      <button data-nivel="3">Nivel 3<small>ir und die nahe Zukunft</small></button>
    </div>
  </div>

  <script>
    // ---------- Die Verben ----------
    // Nur Wortschatz aus ¡Apúntate! 1 (Ausgabe 2024), und nur Verben, die
    // komplett regelmäßig sind. "hacer" und "ver" stehen zwar in Unidad 2,
    // haben aber eine unregelmäßige ich-Form (hago, veo) und bleiben deshalb
    // draußen – sonst würde das Spiel falsche Endungen antrainieren.
    // "ser" ist unregelmäßig und steht ausgeschrieben da, alle anderen werden
    // aus dem Stamm gebildet.
    const VERBOS = [
      // Unregelmäßig: Formen ausgeschrieben, dazu erfundene, aber plausible
      // Fehlformen pro Person – bewusst keine echten spanischen Wörter.
      { inf: "ser", clase: "ser", sentido: "sein",
        formas: ["soy", "eres", "es", "somos", "sois", "son"],
        falsas: [["so","sero"], ["ses","seres"], ["sere"],
                 ["semos","seramos"], ["séis","serís"], ["sen","seren"]] },

      // "ir" braucht keine erfundenen Fehlformen: voy/vas/va/vamos/vais/van
      // verwechselt man schon untereinander genug.
      { inf: "ir", clase: "irv", sentido: "gehen, fahren",
        formas: ["voy", "vas", "va", "vamos", "vais", "van"] },

      // -ar, Unidad 1
      { inf: "hablar",    clase: "ar", sentido: "sprechen" },
      { inf: "estudiar",  clase: "ar", sentido: "lernen" },
      { inf: "escuchar",  clase: "ar", sentido: "hören" },
      { inf: "mirar",     clase: "ar", sentido: "anschauen" },
      { inf: "tocar",     clase: "ar", sentido: "spielen (Instrument)" },
      { inf: "buscar",    clase: "ar", sentido: "suchen" },
      { inf: "charlar",   clase: "ar", sentido: "plaudern" },
      { inf: "tomar",     clase: "ar", sentido: "trinken, nehmen" },
      { inf: "quedar",    clase: "ar", sentido: "sich verabreden" },
      { inf: "pasar",     clase: "ar", sentido: "verbringen" },
      { inf: "descansar", clase: "ar", sentido: "sich ausruhen" },

      // -er, Unidad 2 (Texto A)
      { inf: "comer",     clase: "er", sentido: "essen" },
      { inf: "beber",     clase: "er", sentido: "trinken" },
      { inf: "leer",      clase: "er", sentido: "lesen" },
      { inf: "aprender",  clase: "er", sentido: "erlernen" },
      { inf: "esconder",  clase: "er", sentido: "verstecken" },
      { inf: "responder", clase: "er", sentido: "antworten" },

      // -ir, Unidad 2 (Texto A und B)
      { inf: "vivir",     clase: "ir", sentido: "wohnen, leben" },
      { inf: "escribir",  clase: "ir", sentido: "schreiben" },
      { inf: "compartir", clase: "ir", sentido: "teilen" },
      { inf: "discutir",  clase: "ir", sentido: "streiten" },
      { inf: "abrir",     clase: "ir", sentido: "öffnen" },
    ];

    // Die Level. "pesos" sagt, wie häufig eine Verbgruppe dran kommt – ser ist
    // unregelmäßig und soll deutlich öfter kommen als ein einzelnes -ar-Verb.
    // In Nivel 2 rutscht ser etwas runter, damit Platz für das Neue ist.
    // Zum Nachregeln reichen diese Zahlen (sie sind Anteile, keine Prozente).
    // "futuro" ist der Anteil der Aufgaben, die nach "ir a + Infinitiv"
    // fragen statt nach einer einfachen Form.
    const NIVELES = {
      1: { sub: "-ar und ser",          pesos: { ser: 30, ar: 70 } },
      2: { sub: "dazu -er und -ir",     pesos: { ser: 15, ar: 25, er: 30, ir: 30 } },
      3: { sub: "ir und die Zukunft",   pesos: { irv: 100 }, futuro: 0.7 },
    };

    const VERBO_IR  = VERBOS.find(v => v.clase === "irv");
    const REGULARES = VERBOS.filter(v => !v.formas);

    // Anteil der Aufgaben, in denen einer der beiden Ablenker nicht eine andere
    // Person ist, sondern die gefragte Person mit einer falschen Endung –
    // also genau der Fehler, den sie selbst machen würde (somos → seramos).
    const P_ENDING_FALSO = 0.4;

    // Die sechs Personen. Bei 3. Person und Plural wechseln die Beschriftungen
    // ab, damit sie die Form nicht nur an "él" festmacht.
    const PERSONAS = [
      { etiquetas: ["yo"] },
      { etiquetas: ["tú"] },
      { etiquetas: ["él", "ella"] },
      { etiquetas: ["nosotros", "nosotras"] },
      { etiquetas: ["vosotros", "vosotras"] },
      { etiquetas: ["ellos", "ellas"] },
    ];

    // Die Endungen der drei Gruppen. -er und -ir sind bis auf nosotros und
    // vosotros identisch – genau darauf zielt Nivel 2.
    const TERMINACIONES = {
      ar: ["o", "as", "a", "amos", "áis", "an"],
      er: ["o", "es", "e", "emos", "éis", "en"],
      ir: ["o", "es", "e", "imos", "ís",  "en"],
    };

    function formasDe(v) {
      if (v.formas) return v.formas;
      const raiz = v.inf.slice(0, -2);        // hablar -> habl
      return TERMINACIONES[v.clase].map(t => raiz + t);
    }

    // Dieselbe Person, aber falsche Endung. Bei regelmäßigen Verben die Endung
    // einer anderen Gruppe – in Nivel 1 also schon die aus Nivel 2 (hablamos →
    // hablemos, hablimos). Bei unregelmäßigen eine aus deren "falsas"-Liste.
    // Gibt null zurück, wenn es nichts Falsches gibt: die ich-Form ist in
    // allen drei Gruppen "-o", da ist keine falsche Endung möglich.
    function endingFalso(v, persona, correcta) {
      if (v.formas) {
        const lista = v.falsas ? v.falsas[persona] : [];
        const cand = lista.filter(f => f !== correcta);
        return cand.length ? cand[azar(cand.length)] : null;
      }
      const raiz = v.inf.slice(0, -2);
      const cand = [];
      for (const cl of ["ar", "er", "ir"]) {
        if (cl === v.clase) continue;
        const f = raiz + TERMINACIONES[cl][persona];
        if (f !== correcta) cand.push(f);
      }
      return cand.length ? cand[azar(cand.length)] : null;
    }

    // Ein Verb passend zu den Gewichten des Levels ziehen
    function verboAlAzar() {
      const pesos = NIVELES[nivel].pesos;
      let total = 0;
      for (const k in pesos) total += pesos[k];
      let r = Math.random() * total;
      let clase = Object.keys(pesos)[0];
      for (const k in pesos) { r -= pesos[k]; if (r < 0) { clase = k; break; } }
      const pool = VERBOS.filter(v => v.clase === clase);
      return pool[azar(pool.length)];
    }

    // ---------- Zustand ----------
    const campo    = document.getElementById("campo");
    const grupo    = document.getElementById("grupo");
    const cesta    = document.getElementById("cesta");
    const coinsEl  = document.getElementById("coins");
    const vidasEl  = document.getElementById("vidas");
    const flash    = document.getElementById("flash");

    const ALTO_FICHA = 46;   // Höhe einer Wortkachel in px
    const VIDAS_MAX  = 3;

    let coins = 0;
    try { coins = Number(localStorage.getItem("cece-coins")) || 0; } catch (e) {}
    coinsEl.textContent = coins;

    let bahn, ronda, y, ultimoT, corriendo, vidas, serie, aciertos, monedasRonda, fallos;

    // Das zuletzt gespielte Level merken, damit sie nicht jedes Mal wählen muss
    let nivel = 1;
    try { nivel = Number(localStorage.getItem("cece-verbos-nivel")) || 1; } catch (e) {}
    if (!NIVELES[nivel]) nivel = 1;

    function guardarMonedas() {
      coinsEl.textContent = coins;
      try { localStorage.setItem("cece-coins", coins); } catch (e) {}
    }

    function azar(n) { return Math.floor(Math.random() * n); }

    function mezclar(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = azar(i + 1);
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // ---------- Eine neue Aufgabe bauen ----------
    function nuevaRonda() {
      const nv = NIVELES[nivel];
      const persona = azar(6);
      const futuro = !!nv.futuro && Math.random() < nv.futuro;
      const senuelos = [];
      let verbo, correcta;

      if (futuro) {
        // "nosotros + hablar" → "vamos a hablar": nur "ir" wird konjugiert,
        // das zweite Verb bleibt im Infinitiv. Genau da passieren die Fehler.
        verbo = REGULARES[azar(REGULARES.length)];
        const ir = VERBO_IR.formas;
        correcta = ir[persona] + " a " + verbo.inf;

        if (Math.random() < P_ENDING_FALSO) {
          // Die zwei typischen Baufehler: zweites Verb mitkonjugiert
          // ("vamos a hablamos") oder das "a" vergessen ("vamos hablar").
          const malas = [
            ir[persona] + " a " + formasDe(verbo)[persona],
            ir[persona] + " " + verbo.inf,
          ];
          senuelos.push(malas[azar(malas.length)]);
        }
        // Auffüllen mit derselben Wendung in einer anderen Person
        for (const i of mezclar([0, 1, 2, 3, 4, 5].filter(i => i !== persona))) {
          if (senuelos.length >= 2) break;
          const f = ir[i] + " a " + verbo.inf;
          if (!senuelos.includes(f)) senuelos.push(f);
        }
      } else {
        verbo = verboAlAzar();
        const formas = formasDe(verbo);
        correcta = formas[persona];

        // Die beiden Ablenker. Normalerweise andere Personen desselben Verbs –
        // dadurch muss sie die Endung wirklich der Person zuordnen und kann
        // nicht über den Wortstamm raten. In einem Teil der Aufgaben ist einer
        // davon stattdessen die gefragte Person mit falscher Endung.
        if (Math.random() < P_ENDING_FALSO) {
          const f = endingFalso(verbo, persona, correcta);
          if (f) senuelos.push(f);
        }
        for (const f of mezclar(formas.filter(f => f !== correcta))) {
          if (senuelos.length >= 2) break;
          if (!senuelos.includes(f)) senuelos.push(f);
        }
      }

      // Mischen, damit die richtige Form nicht immer an derselben Stelle liegt
      const opciones = mezclar([correcta, ...senuelos]);

      const etiquetas = PERSONAS[persona].etiquetas;
      ronda = {
        verbo,
        persona,
        futuro,
        etiqueta: etiquetas[azar(etiquetas.length)],
        formas: opciones,
        correcta: opciones.indexOf(correcta),
      };

      document.getElementById("pron").textContent = ronda.etiqueta;
      document.getElementById("inf").textContent = verbo.inf;
      document.getElementById("sentido").textContent = verbo.sentido;
      document.getElementById("tiempo").style.display = futuro ? "inline-block" : "none";

      // Ganze Wendungen brauchen kleinere Schrift, sonst passen sie nicht
      // auf die Kachel. Alle drei gleich, damit keine auffällt.
      const larga = Math.max(...ronda.formas.map(f => f.length)) > 10;

      grupo.innerHTML = "";
      ronda.formas.forEach((f, i) => {
        const d = document.createElement("div");
        d.className = larga ? "ficha larga" : "ficha";
        d.style.left = (i * 100 / 3) + "%";
        d.innerHTML = "<span></span>";
        d.firstChild.textContent = f;
        grupo.appendChild(d);
      });

      y = -ALTO_FICHA;
      grupo.style.transform = "translateY(" + y + "px)";
    }

    // Tempo: Stützpunkte [richtige Wörter, Sekunden pro Kachel].
    // Dazwischen wird gerade interpoliert, das Tempo ändert sich also bei
    // jedem einzelnen Wort ein kleines bisschen statt in Sprüngen.
    // Nach dem letzten Stützpunkt bleibt es beim Höchsttempo.
    // Zum Nachregeln reicht diese Tabelle.
    const TEMPO = [
      [0,  13.8],
      [40,  2.0],
      [60,  1.0],
      [80,  0.5],
    ];

    // Fallzeit in Sekunden für den aktuellen Stand
    function duracion() {
      const n = aciertos;
      if (n <= TEMPO[0][0]) return TEMPO[0][1];
      for (let i = 1; i < TEMPO.length; i++) {
        const [n0, s0] = TEMPO[i - 1], [n1, s1] = TEMPO[i];
        if (n <= n1) return s0 + (s1 - s0) * (n - n0) / (n1 - n0);
      }
      return TEMPO[TEMPO.length - 1][1];      // Höchsttempo, bleibt so
    }

    function moverCesta(d) {
      if (!corriendo) return;
      bahn = Math.max(0, Math.min(2, bahn + d));
      cesta.style.left = (bahn * 100 / 3) + "%";
    }

    // ---------- Fangen auswerten ----------
    function resolver() {
      corriendo = false;
      const elegida = ronda.formas[bahn];
      const correcta = ronda.formas[ronda.correcta];
      const bien = bahn === ronda.correcta;

      if (bien) {
        aciertos++;
        serie++;
        let ganado = 1;
        if (serie % 5 === 0) ganado += 3;     // Bonus für fünf in Folge
        coins += ganado;
        monedasRonda += ganado;
        guardarMonedas();
        mostrarFlotante(ganado);
        mostrarFlash("✅", serie >= 3 ? "¡" + serie + " seguidas!" : "¡Muy bien!",
                     ronda.etiqueta + " " + correcta);
      } else {
        vidas--;
        serie = 0;
        pintarVidas();
        // Immer mit der Grundform der Person merken: "ellos" und "ellas" sind
        // derselbe Fehler und sollen in der Lernliste nicht doppelt stehen.
        const clave = PERSONAS[ronda.persona].etiquetas[0] + " " + correcta;
        fallos.set(clave, (fallos.get(clave) || 0) + 1);
        mostrarFlash("❌", ronda.etiqueta + " " + correcta,
                     "Du hattest: " + elegida);
      }

      setTimeout(() => {
        flash.style.display = "none";
        if (vidas <= 0) return finDelJuego();
        nuevaRonda();
        corriendo = true;
        ultimoT = null;
        requestAnimationFrame(bucle);
      }, bien ? 700 : 1500);
    }

    function mostrarFlash(marca, txt, sub) {
      document.getElementById("flash-marca").textContent = marca;
      document.getElementById("flash-txt").textContent = txt;
      document.getElementById("flash-sub").textContent = sub;
      flash.style.display = "flex";
    }

    function pintarVidas() {
      let s = "";
      for (let i = 0; i < VIDAS_MAX; i++) {
        s += i < vidas ? '<span>❤️</span>' : '<span class="perdida">❤️</span>';
      }
      vidasEl.innerHTML = s;
    }

    function mostrarFlotante(n) {
      const r = campo.getBoundingClientRect();
      const f = document.createElement("div");
      f.className = "float";
      f.innerHTML = "+" + n + ' <img src="coin.svg" alt="">';
      f.style.left = Math.min(r.left + r.width / 2 - 40, window.innerWidth - 120) + "px";
      f.style.top = (r.top + r.height / 2) + "px";
      document.body.appendChild(f);
      setTimeout(() => f.remove(), 1200);
    }

    // ---------- Fallschleife ----------
    // Fallstrecke der Kachel: von oben bis kurz über die Kiste
    function recorrido() { return campo.clientHeight - 24; }

    // Sofort fallen lassen – wenn sie die Form schon weiß, muss sie nicht warten
    function soltar() {
      if (!corriendo) return;
      y = recorrido() - ALTO_FICHA;
      grupo.style.transform = "translateY(" + y + "px)";
      resolver();
    }

    function bucle(t) {
      if (!corriendo) return;
      if (ultimoT === null) ultimoT = t;
      const dt = (t - ultimoT) / 1000;
      ultimoT = t;

      // Die Kachel startet bei y = -ALTO_FICHA und wird bei
      // y = recorrido - ALTO_FICHA ausgewertet, legt also genau
      // "recorrido" Pixel zurück. Das Tempo muss über dieselbe Strecke
      // gerechnet werden, sonst ist die echte Fallzeit kürzer als duracion().
      y += recorrido() / duracion() * dt;
      grupo.style.transform = "translateY(" + y + "px)";

      if (y >= recorrido() - ALTO_FICHA) return resolver();
      requestAnimationFrame(bucle);
    }

    // ---------- Ende ----------
    function finDelJuego() {
      corriendo = false;
      document.getElementById("round").textContent = monedasRonda;
      document.getElementById("aciertos").textContent = aciertos;
      document.getElementById("nivelFin").textContent = "Nivel " + nivel + ": " + NIVELES[nivel].sub;

      const caja = document.getElementById("repasar");
      if (fallos.size) {
        const lista = [...fallos.entries()]
          .sort((a, b) => b[1] - a[1])
          .slice(0, 6)
          .map(([clave]) => {
            const corte = clave.indexOf(" ");
            return "<li>" + clave.slice(0, corte) + " <b>" + clave.slice(corte + 1) + "</b></li>";
          })
          .join("");
        caja.innerHTML = "<h3>Das übst du noch:</h3><ul>" + lista + "</ul>";
      } else {
        caja.innerHTML = "<h3>Kein einziger Fehler. ¡Genial!</h3>";
      }
      document.getElementById("over").style.display = "flex";
    }

    function empezar() {
      document.getElementById("over").style.display = "none";
      document.getElementById("inicio").style.display = "none";
      flash.style.display = "none";
      vidas = VIDAS_MAX;
      serie = 0;
      aciertos = 0;
      monedasRonda = 0;
      fallos = new Map();
      bahn = 1;
      cesta.style.left = (bahn * 100 / 3) + "%";
      pintarVidas();
      nuevaRonda();
      corriendo = true;
      ultimoT = null;
      requestAnimationFrame(bucle);
    }

    // ---------- Steuerung ----------
    function boton(id, accion) {
      const b = document.getElementById(id);
      b.addEventListener("pointerdown", (e) => { e.preventDefault(); accion(); });
    }
    boton("izq", () => moverCesta(-1));
    boton("der", () => moverCesta(1));
    boton("btn-soltar", soltar);

    // Am Computer auch mit den Pfeiltasten, runter oder Leertaste lässt fallen
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") moverCesta(-1);
      else if (e.key === "ArrowRight") moverCesta(1);
      else if (e.key === "ArrowDown" || e.key === " ") soltar();
      else return;
      e.preventDefault();
    });

    // Direkt auf eine Bahn tippen geht auch
    campo.addEventListener("pointerdown", (e) => {
      if (!corriendo) return;
      const r = campo.getBoundingClientRect();
      const destino = Math.max(0, Math.min(2, Math.floor((e.clientX - r.left) / (r.width / 3))));
      bahn = destino;
      cesta.style.left = (bahn * 100 / 3) + "%";
    });

    // ---------- Levelauswahl ----------
    function mostrarInicio() {
      corriendo = false;
      document.getElementById("over").style.display = "none";
      flash.style.display = "none";
      document.getElementById("inicio").style.display = "flex";
    }

    document.querySelectorAll("#inicio button[data-nivel]").forEach((b) => {
      b.addEventListener("click", () => {
        nivel = Number(b.dataset.nivel);
        try { localStorage.setItem("cece-verbos-nivel", nivel); } catch (e) {}
        empezar();
      });
    });

    document.getElementById("again").addEventListener("click", empezar);
    document.getElementById("cambiar").addEventListener("click", mostrarInicio);
    mostrarInicio();
  </script>
</body>
</html>
