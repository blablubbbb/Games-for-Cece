<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ser · estar · hay – Games for Cece</title>
  <style>
    html, body { margin: 0; height: 100%; overscroll-behavior: none; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #ffb3d9, #b3c6ff);
      color: #2b1a4a;
      display: flex; flex-direction: column; align-items: center;
      padding: 0.5rem; box-sizing: border-box;
      user-select: none; -webkit-user-select: none; touch-action: manipulation;
    }
    .top {
      width: 100%; max-width: 420px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 0.4rem;
    }
    .top a, .pill {
      background: #fff8; border-radius: 999px; padding: 0.3rem 0.9rem;
      font-size: 1.15rem; font-weight: bold; color: inherit; text-decoration: none;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .coin { width: 1.5em; height: 1.5em; }
    .vidas .perdida { opacity: 0.25; }

    .tarea {
      width: min(94vw, 420px);
      background: #fff; border-radius: 1rem; box-shadow: 0 4px 0 #0002;
      padding: 0.8rem 0.9rem 0.7rem; box-sizing: border-box;
      text-align: center; position: relative;
    }
    .serie {
      position: absolute; left: 0.7rem; top: 0.5rem;
      font-size: 0.95rem; font-weight: bold; color: #7b3fe4;
    }
    .serie.apagada { opacity: 0.25; }

    /* Der Satz muss als ein Block fließen. Macht man .frase selbst zum
       Flex-Container, wird die Lücke ein eigenes Flex-Element und der Satz
       zerfällt in drei nebeneinanderstehende Teile. */
    .caja-frase {
      min-height: 4.4em;
      display: flex; align-items: center; justify-content: center;
    }
    .frase {
      display: block;
      font-size: clamp(1.15rem, 5.4vw, 1.55rem); font-weight: bold;
      line-height: 1.45;
    }
    .hueco {
      display: inline-block; min-width: 3.2em;
      border-bottom: 3px dotted #7b3fe4; color: #7b3fe4;
    }
    .hueco.lleno { border-bottom-color: transparent; background: #ffd34d55; border-radius: 6px; }

    .pista {
      font-size: 0.92rem; opacity: 0; min-height: 1.3em;
      color: #2b1a4a; transition: opacity 0.2s;
    }
    .pista.ver { opacity: 0.8; }

    .barra { height: 8px; border-radius: 4px; background: #2b1a4a1a; overflow: hidden; margin-top: 0.4rem; }
    .barra div { height: 100%; width: 100%; background: #7b3fe4; transform-origin: left; }
    .barra div.poco { background: #e4573f; }

    .tarea.sacude { animation: sacudir 0.35s; }
    @keyframes sacudir {
      0%,100% { transform: translateX(0); } 20% { transform: translateX(-9px); }
      40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(4px); }
    }

    .opciones {
      width: min(94vw, 420px); margin-top: 0.6rem;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem;
    }
    .opciones button {
      border: none; border-radius: 14px; background: #fff; color: #2b1a4a;
      box-shadow: 0 4px 0 #0003; font-weight: bold;
      font-size: clamp(1rem, 4.6vw, 1.3rem);
      padding: 0.9rem 0.3rem; line-height: 1.2;
    }
    .opciones button:active { transform: translateY(3px); box-shadow: 0 1px 0 #0003; }
    .opciones button.bien { background: #ffd34d; }
    .opciones button.mal { background: #e4573f; color: #fff; }

    .flota {
      position: fixed; font-size: 1.9rem; font-weight: bold; pointer-events: none;
      animation: subir 1.1s forwards; text-shadow: 0 2px 0 #fff;
      display: flex; align-items: center; gap: 0.25rem; z-index: 5;
    }
    .flota img { width: 2rem; height: 2rem; }
    @keyframes subir { to { transform: translateY(-80px); opacity: 0; } }

    #over, #inicio {
      position: fixed; inset: 0; background: #0008;
      display: none; align-items: center; justify-content: center;
      padding: 1rem; box-sizing: border-box; z-index: 10;
    }
    #over .box, #inicio .box {
      background: #fff; border-radius: 1rem; padding: 1.2rem 1.3rem; text-align: center;
      max-width: 340px; width: 100%; box-sizing: border-box; max-height: 92dvh; overflow-y: auto;
    }
    #over h2, #inicio h2 { margin: 0 0 0.5rem; }
    #over .pill, #inicio .pill { justify-content: center; background: none; }
    #over button, #inicio button {
      font-size: 1.2rem; padding: 0.7rem 1.5rem; border: none;
      border-radius: 999px; background: #7b3fe4; color: #fff; margin-top: 0.9rem;
    }
    .marcas { text-align: left; margin-top: 0.6rem; font-size: 0.95rem; }
    .marcas div { display: flex; justify-content: space-between; padding: 0.15rem 0; }
    .marcas b { color: #7b3fe4; }
    .repasar { margin-top: 0.8rem; text-align: left; font-size: 0.92rem; }
    .repasar h3 { margin: 0 0 0.3rem; font-size: 0.95rem; }
    .repasar ul { margin: 0; padding-left: 1.1rem; }
    .repasar b { color: #7b3fe4; }
    .ayuda { font-size: 0.86rem; text-align: left; opacity: 0.8; margin-top: 0.4rem; line-height: 1.45; }
    .ayuda b { color: #7b3fe4; }
  </style>
</head>
<body>
  <div class="top">
    <a href="index.html">⬅︎</a>
    <div class="pill vidas" id="vidas">❤️❤️❤️</div>
    <div class="pill"><img class="coin" src="coin.svg" alt="Münzen"><span id="coins">0</span></div>
  </div>

  <div class="tarea" id="tarea">
    <div class="serie apagada" id="serie">🔥<span id="serie-n">0</span></div>
    <div class="caja-frase"><div class="frase" id="frase">–</div></div>
    <div class="pista" id="pista"></div>
    <div class="barra"><div id="barra"></div></div>
  </div>

  <div class="opciones" id="opciones"></div>

  <div id="inicio">
    <div class="box">
      <h2>ser · estar · hay</h2>
      <div class="ayuda">
        Welches Wort passt in die Lücke?<br>
        <b>ser</b> – wer oder wie jemand ist, woher er kommt, Uhrzeit und Datum.<br>
        <b>estar</b> – wo jemand oder etwas ist, und wie es einem geht.<br>
        <b>hay</b> – „es gibt“. Bleibt immer gleich, egal wie viele.
      </div>
      <div class="marcas" id="marcas-inicio"></div>
      <button id="btn-empezar">Los geht's</button>
    </div>
  </div>

  <div id="over">
    <div class="box">
      <h2>¡Se acabó!</h2>
      <div class="pill">In dieser Runde: <img class="coin" src="coin.svg" alt="Münzen"><span id="round">0</span></div>
      <div class="marcas" id="marcas-fin"></div>
      <div class="repasar" id="repasar"></div>
      <button id="btn-otra">Nochmal</button>
    </div>
  </div>

  <script src="fallos.js"></script>
  <script>
    // ---------- Die Sätze ----------
    // Jeder Satz: [Text mit ___, richtiges Wort, Person (0-5), Merksatz]
    // Die Person braucht es für die beiden falschen Antworten: zu "Mi hermana"
    // gehören "es" und "está", zu "Mis amigos" dagegen "son" und "están".
    // Jedes Wort ist gegen ihren ¡Apúntate!-Wortschatz geprüft.
    const FRASES = [
      ["Yo ___ de Alemania.", "ser", 0, "Woher jemand kommt → ser"],
      ["Tú ___ muy simpático.", "ser", 1, "Wie jemand ist → ser"],
      ["Mi hermana ___ alta.", "ser", 2, "Eigenschaft → ser"],
      ["Nosotros ___ de Madrid.", "ser", 3, "Woher jemand kommt → ser"],
      ["Vosotros ___ mis amigos.", "ser", 4, "Wer jemand ist → ser"],
      ["Mis primos ___ muy majos.", "ser", 5, "Wie jemand ist → ser"],
      ["Hoy ___ jueves.", "ser", 2, "Wochentag → ser"],
      ["___ las seis de la tarde.", "ser", 5, "Uhrzeit → ser"],
      ["Mi familia ___ bastante pequeña.", "ser", 2, "Eigenschaft → ser"],
      ["Este ___ mi padre.", "ser", 2, "Wer jemand ist → ser"],
      ["Nuestras aulas ___ muy modernas.", "ser", 5, "Eigenschaft → ser"],
      ["¿Quién ___ ella?", "ser", 2, "Wer jemand ist → ser"],
      ["Mi abuela ___ un poco estricta.", "ser", 2, "Wie jemand ist → ser"],
      ["Los profes ___ simpáticos.", "ser", 5, "Wie jemand ist → ser"],
      ["¿De dónde ___ tú?", "ser", 1, "Woher jemand kommt → ser"],
      ["Yo ___ la nueva de la clase.", "ser", 0, "Wer jemand ist → ser"],
      ["Mi cumple ___ en enero.", "ser", 2, "Datum → ser"],
      ["Tú y yo ___ amigos.", "ser", 3, "Wer jemand ist → ser"],
      ["Mi libro ___ encima de la cama.", "estar", 2, "Wo etwas ist → estar"],
      ["Yo ___ en el salón.", "estar", 0, "Wo jemand ist → estar"],
      ["¿Dónde ___ tú?", "estar", 1, "Wo jemand ist → estar"],
      ["Nosotros ___ en el patio.", "estar", 3, "Wo jemand ist → estar"],
      ["Mis amigos ___ en la heladería.", "estar", 5, "Wo jemand ist → estar"],
      ["El escritorio ___ entre la puerta y el armario.", "estar", 2, "Wo etwas ist → estar"],
      ["¿Vosotros ___ en casa?", "estar", 4, "Wo jemand ist → estar"],
      ["La guitarra ___ al lado de la estantería.", "estar", 2, "Wo etwas ist → estar"],
      ["Las fotos ___ debajo de la ventana.", "estar", 5, "Wo etwas sind → estar"],
      ["El gato ___ en el armario.", "estar", 2, "Ein bestimmtes Ding an einem Ort → estar"],
      ["Mamá ___ en la cocina.", "estar", 2, "Wo jemand ist → estar"],
      ["Yo ___ muy bien.", "estar", 0, "Wie es einem geht → estar"],
      ["Mi mochila ___ detrás de la silla.", "estar", 2, "Wo etwas ist → estar"],
      ["Los libros ___ en la estantería.", "estar", 5, "Wo etwas sind → estar"],
      ["Mi móvil ___ debajo de la cama.", "estar", 2, "Wo etwas ist → estar"],
      ["Quizás ___ encima del escritorio.", "estar", 2, "Wo etwas ist → estar"],
      ["En mi habitación ___ una cama.", "hay", 2, "„es gibt“ → hay"],
      ["___ muchos libros en mi rincón.", "hay", 5, "„es gibt“ → hay"],
      ["En el dibujo ___ una habitación.", "hay", 2, "„es gibt“ → hay"],
      ["A la derecha ___ una ventana.", "hay", 2, "„es gibt“ → hay"],
      ["En mi barrio ___ un parque.", "hay", 2, "„es gibt“ → hay"],
      ["¿Qué ___ en tu habitación?", "hay", 2, "„was gibt es“ → hay"],
      ["En el armario ___ un gato.", "hay", 2, "Unbestimmt (ein, eine) → hay"],
      ["Delante del sillón ___ una lámpara.", "hay", 2, "„es gibt“ → hay"],
      ["En mi clase ___ veinte alumnos.", "hay", 5, "„es gibt“ → hay"],
      ["Encima de la mesa ___ dos fotos.", "hay", 5, "„es gibt“ → hay"],
      ["Detrás de la puerta ___ un espejo.", "hay", 2, "„es gibt“ → hay"],
      ["En el centro ___ una plaza.", "hay", 2, "„es gibt“ → hay"],
      ["También ___ un sillón.", "hay", 2, "„es gibt“ → hay"],
      ["En la plaza ___ muchas tiendas.", "hay", 5, "„es gibt“ → hay"],
    ];

    const SER   = ["soy", "eres", "es", "somos", "sois", "son"];
    const ESTAR = ["estoy", "estás", "está", "estamos", "estáis", "están"];

    const VIDAS_MAX = 3;
    const JUEGO = "estar";
    const TIEMPO = [[0, 14], [15, 10], [40, 8], [70, 6]];

    const elFrase = document.getElementById("frase");
    const elPista = document.getElementById("pista");
    const elOpciones = document.getElementById("opciones");
    const elBarra = document.getElementById("barra");
    const elTarea = document.getElementById("tarea");
    const elSerie = document.getElementById("serie");
    const elSerieN = document.getElementById("serie-n");
    const elVidas = document.getElementById("vidas");
    const elCoins = document.getElementById("coins");

    let coins = 0;
    try { coins = Number(localStorage.getItem("cece-coins")) || 0; } catch (e) {}
    elCoins.textContent = coins;

    let rec = { serie: 0, aciertos: 0 };
    try { rec = Object.assign(rec, JSON.parse(localStorage.getItem("cece-estar-rec") || "{}")); } catch (e) {}

    let ronda, vidas, serie, serieMax, aciertos, monedasRonda, corriendo;
    let t0, duracionRonda, animId, fallosRonda;

    function azar(n) { return Math.floor(Math.random() * n); }
    function mezclar(a) {
      for (let i = a.length - 1; i > 0; i--) { const j = azar(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }
    function guardarMonedas() {
      elCoins.textContent = coins;
      try { localStorage.setItem("cece-coins", coins); } catch (e) {}
    }

    // Steht die Lücke am Satzanfang, muss das eingesetzte Wort groß werden
    function enHueco(texto, palabra, lleno) {
      const alPrincipio = texto.trim().startsWith("___");
      const p = alPrincipio ? palabra.charAt(0).toUpperCase() + palabra.slice(1) : palabra;
      return texto.replace("___", '<span class="hueco' + (lleno ? " lleno" : "") + '">' + p + "</span>");
    }

    // ---------- Eine neue Aufgabe ----------
    function nuevaRonda() {
      // Was danebenging, kommt ein paar Aufgaben später von selbst zurück
      const pend = Fallos.pendiente(JUEGO);
      let i = (pend !== null && /^f\d+$/.test(pend)) ? Number(pend.slice(1)) : -1;
      if (i < 0 || i >= FRASES.length) {
        i = Number(Fallos.elegir(JUEGO, FRASES.map((_, k) => "f" + k)).slice(1));
      }
      const [texto, verbo, persona, pista] = FRASES[i];

      // Die drei Antworten: ser und estar in der passenden Person, dazu hay
      const opciones = mezclar([SER[persona], ESTAR[persona], "hay"]);
      const correcta = verbo === "hay" ? "hay" : (verbo === "ser" ? SER[persona] : ESTAR[persona]);

      ronda = { i, texto, verbo, persona, pista, correcta,
                clave: "f" + i, idx: opciones.indexOf(correcta) };

      elFrase.innerHTML = enHueco(texto, "?", false);
      elPista.classList.remove("ver");
      elPista.textContent = "";
      elOpciones.innerHTML = opciones.map(o => "<button>" + o + "</button>").join("");
      [...elOpciones.children].forEach((b, k) => {
        b.addEventListener("pointerdown", (e) => { e.preventDefault(); elegir(k); });
      });

      duracionRonda = segundos();
      t0 = performance.now();
      corriendo = true;
      cancelAnimationFrame(animId);
      animId = requestAnimationFrame(tictac);
    }

    function segundos() {
      const n = aciertos;
      if (n <= TIEMPO[0][0]) return TIEMPO[0][1];
      for (let k = 1; k < TIEMPO.length; k++) {
        const [n0, s0] = TIEMPO[k - 1], [n1, s1] = TIEMPO[k];
        if (n <= n1) return s0 + (s1 - s0) * (n - n0) / (n1 - n0);
      }
      return TIEMPO[TIEMPO.length - 1][1];
    }

    function tictac(t) {
      if (!corriendo) return;
      const queda = 1 - (t - t0) / (duracionRonda * 1000);
      elBarra.style.transform = "scaleX(" + Math.max(0, queda) + ")";
      elBarra.classList.toggle("poco", queda < 0.25);
      if (queda <= 0) return resolver(-1);
      animId = requestAnimationFrame(tictac);
    }

    // ---------- Auswerten ----------
    function elegir(k) { if (corriendo) resolver(k); }

    function resolver(k) {
      corriendo = false;
      cancelAnimationFrame(animId);
      const bien = k === ronda.idx;

      Fallos.anotar(JUEGO, ronda.clave, bien, ronda.texto.replace("___", ronda.correcta));

      // Den Satz mit der richtigen Lösung stehen lassen – das ist der Moment,
      // in dem sie es sich merkt.
      elFrase.innerHTML = enHueco(ronda.texto, ronda.correcta, true);
      const botones = [...elOpciones.children];
      botones[ronda.idx].classList.add("bien");
      if (!bien && k >= 0) botones[k].classList.add("mal");
      botones.forEach(b => b.style.pointerEvents = "none");

      if (bien) {
        aciertos++; serie++;
        if (serie > serieMax) serieMax = serie;
        let ganado = 1;
        if (serie % 5 === 0) ganado += 3;
        coins += ganado; monedasRonda += ganado;
        guardarMonedas();
        flotante("+" + ganado);
      } else {
        vidas--; serie = 0;
        fallosRonda.set(ronda.texto.replace("___", ronda.correcta), ronda.pista);
        pintarVidas();
        elPista.textContent = ronda.pista;
        elPista.classList.add("ver");
        elTarea.classList.add("sacude");
        setTimeout(() => elTarea.classList.remove("sacude"), 360);
      }
      pintarSerie();

      setTimeout(() => {
        if (vidas <= 0) return finDelJuego();
        nuevaRonda();
      }, bien ? 900 : 2600);
    }

    function pintarSerie() {
      elSerieN.textContent = serie;
      elSerie.classList.toggle("apagada", serie === 0);
    }

    function pintarVidas() {
      let s = "";
      for (let i = 0; i < VIDAS_MAX; i++) s += i < vidas ? "<span>❤️</span>" : '<span class="perdida">❤️</span>';
      elVidas.innerHTML = s;
    }

    function flotante(txt) {
      const r = elTarea.getBoundingClientRect();
      const f = document.createElement("div");
      f.className = "flota";
      f.innerHTML = txt + ' <img src="coin.svg" alt="">';
      f.style.left = Math.min(r.left + r.width / 2 - 40, window.innerWidth - 110) + "px";
      f.style.top = (r.top + r.height / 2) + "px";
      document.body.appendChild(f);
      setTimeout(() => f.remove(), 1100);
    }

    function listaMarcas(destino) {
      document.getElementById(destino).innerHTML =
        "<div><span>Längste Serie</span><b>" + rec.serie + "</b></div>" +
        "<div><span>Meiste richtig</span><b>" + rec.aciertos + "</b></div>";
    }

    function finDelJuego() {
      corriendo = false;
      if (serieMax > rec.serie) rec.serie = serieMax;
      if (aciertos > rec.aciertos) rec.aciertos = aciertos;
      try { localStorage.setItem("cece-estar-rec", JSON.stringify(rec)); } catch (e) {}

      document.getElementById("round").textContent = monedasRonda;
      listaMarcas("marcas-fin");
      const caja = document.getElementById("repasar");
      if (fallosRonda.size) {
        caja.innerHTML = "<h3>Das übst du noch:</h3><ul>" +
          [...fallosRonda.entries()].slice(0, 5)
            .map(([f, p]) => "<li>" + f + "<br><b>" + p + "</b></li>").join("") + "</ul>";
      } else {
        caja.innerHTML = "<h3>Kein einziger Fehler. ¡Genial!</h3>";
      }
      document.getElementById("over").style.display = "flex";
    }

    function empezar() {
      document.getElementById("over").style.display = "none";
      document.getElementById("inicio").style.display = "none";
      vidas = VIDAS_MAX;
      serie = 0; serieMax = 0;
      aciertos = 0; monedasRonda = 0;
      fallosRonda = new Map();
      pintarVidas(); pintarSerie();
      nuevaRonda();
    }

    function mostrarInicio() {
      corriendo = false;
      cancelAnimationFrame(animId);
      document.getElementById("over").style.display = "none";
      listaMarcas("marcas-inicio");
      document.getElementById("inicio").style.display = "flex";
    }

    document.getElementById("btn-empezar").addEventListener("click", empezar);
    document.getElementById("btn-otra").addEventListener("click", empezar);
    mostrarInicio();
  </script>
</body>
</html>
